[package]
name = "demo-support-triage-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
sidecar-test = ["dep:light-a2a", "dep:a2a-core"]

[dependencies]
light-a2a = { path = "../../../light-fabric/apps/light-a2a", optional = true }
a2a-core = { path = "../../../light-fabric/crates/a2a-core", optional = true }
a2a-backend = { path = "../../../light-fabric/crates/a2a-backend" }
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid = { version = "1", features = ["v7", "serde"] }

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
chrono = "0.4"
tempfile = "3"
